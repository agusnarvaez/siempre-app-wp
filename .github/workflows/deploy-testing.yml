name: deploy-testing
on:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  qa:
    uses: agusnarvaez/bapps-workflows/.github/workflows/qa.yml@v1
  security:
    uses: agusnarvaez/bapps-workflows/.github/workflows/security.yml@v1
  deploy:
    needs: qa
    uses: agusnarvaez/bapps-workflows/.github/workflows/deploy-vps.yml@v1
    with: { app: siempre, env: testing, health-url: 'https://siempre-testing.bapps.com.ar/version.json', build-dir: dist }
    secrets: inherit
  e2e:
    needs: deploy
    uses: agusnarvaez/bapps-workflows/.github/workflows/e2e.yml@v1
    with: { base-url: 'https://siempre-testing.bapps.com.ar' }
